# Local override: pass the DingTalk bot encryption key into the backend.
# The stock docker-compose.selfhost.yml environment whitelist does not yet
# include it; layer this file explicitly:
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.selfhost.dingtalk.yml up -d
services:
  backend:
    environment:
      MULTICA_DINGTALK_SECRET_KEY: ${MULTICA_DINGTALK_SECRET_KEY:?set MULTICA_DINGTALK_SECRET_KEY in .env}
